name: Update README stats

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require private stats token
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          if [ -z "$STATS_PAT" ]; then
            echo '::error::Add the STATS_PAT repository Actions secret, then run this workflow again.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        env:
          FETCH_MULTI_PAGE_STARS: 'true'
        with:
          card: stats
          core_version: '2.2.1'
          options: username=${{ github.repository_owner }}&theme=vue-dark&show_icons=true&bg_color=0D1117&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: 'true'

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          core_version: '2.2.1'
          options: username=${{ github.repository_owner }}&theme=vue-dark&layout=compact&bg_color=0D1117&hide_border=true&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: 'true'

      - name: Commit generated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo 'Stats cards are unchanged.'
            exit 0
          fi
          git commit -m 'Update README stats cards'
          git push origin HEAD:main
