name: Generate Snake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: combined-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Platane/snk
          ref: a041d6c27ba561a39f5be9c26a784812765e434b
          path: .snake-engine
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test calendar merging
        run: node --test scripts/merge-contributions.test.mjs
      - name: Build combined snake generator
        run: |
          npm install --prefix "$RUNNER_TEMP/snake-tools" --no-audit --no-fund esbuild@0.25.12
          cp scripts/combined-snake.ts scripts/merge-contributions.mjs .snake-engine/
          cd .snake-engine
          "$RUNNER_TEMP/snake-tools/node_modules/.bin/esbuild" combined-snake.ts --bundle --platform=node --format=esm --outfile=../combined-snake.mjs --alias:@snk/types=./packages/types --alias:@snk/solver=./packages/solver
      - name: Generate combined calendar snake
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          AMANKWORKS_PAT: ${{ secrets.AMANKWORKS_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node combined-snake.mjs
      - name: Publish snake SVGs
        run: |
          git fetch origin output
          git switch --create snake-output origin/output
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update combined GitHub and GitLab contribution snake'
          git push origin HEAD:output
